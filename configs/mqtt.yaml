# Repo-wide semantic MQTT convention. Keep disabled until a broker is deployed.
mqtt:
  enabled: true
  host: "localhost"
  port: 1883
  client_id: "translation-runtime"
  topic_base: "bwm"
  qos: 1
  reconnect_min_seconds: 2
  reconnect_max_seconds: 30

# GPIO14/15 BWM inter-Pi UART.  uart0 is resolved from device tree; never use
# /dev/serial0, which may be the Pi 5 debug UART.
uart:
  enabled: true
  device_mode: uart0
  baud_rate: 115200
  bytesize: 8
  parity: N
  stopbits: 1
  timeout_seconds: 0.25
  max_frame_bytes: 8192

# Optional Pi-central receiver for the BWM Vision ESP32 GATT notifications.
# It is a semantic transport only; it has no session or inactive-state policy.
ble:
  enabled: true
  service_uuid: "7a9e4c10-5b8d-4bd6-9c17-2f3e8a4b1001"
  characteristic_uuid: "7a9e4c10-5b8d-4bd6-9c17-2f3e8a4b1002"
  advertised_name: "BWM Vision"
  scan_timeout_seconds: 8
  reconnect_seconds: 5
  max_message_bytes: 4096
