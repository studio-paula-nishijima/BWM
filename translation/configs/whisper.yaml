sample_rate: 16000
frame_ms: 30
device: "plughw:2,0"

# Independent of processing_mode and classifier selection.
detector_profile: webrtc_assisted_temporal
detector_profiles:
  webrtc_assisted_temporal:
    silero_median_min: 0.0025
    silero_median_max: 0.5
    rolling_window_frames: 10
    low_proportion_std_min: 0.05
    low_proportion_max: 0.85
    webrtc_enabled: true
    webrtc_aggressiveness: 0
    webrtc_enter_frames: 10
    webrtc_exit_frames: 10
    assisted_confirmation_frames: 15
    fallback_confirmation_frames: 24
  temporal_only:
    silero_median_min: 0.0025
    silero_median_max: 0.5
    rolling_window_frames: 10
    low_proportion_std_min: 0.05
    low_proportion_max: 0.85
    fallback_confirmation_frames: 24
  analysis_full:
    silero_median_min: 0.0025
    silero_median_max: 0.5
    rolling_window_frames: 10
    low_proportion_std_min: 0.05
    low_proportion_max: 0.85
    webrtc_aggressiveness: 0
    webrtc_enter_frames: 10
    webrtc_exit_frames: 10
    assisted_confirmation_frames: 15
    fallback_confirmation_frames: 24

live_diagnostic_logging:
  enabled: false
  max_frames: 0

# Appended to analysis CSV filenames by default; --analysis-tag overrides it.
analysis_filename_tag: "3L"

# Processing modes:
# - direct: runs the primary legacy classifier without a speech detector.
#           grouped_v1 is rejected because it requires real Silero evidence.
# - speech_gate: the speech detector gates legacy whisper processing.
# - shadow: runs speech and whisper classifiers every frame; speech does not
#           suppress the primary whisper decision. Recommended for analysis.
processing_mode: shadow

# Speech detector backends:
# - silero: streaming Silero VAD at 16 kHz. Required by grouped_v1.
# - feature: legacy threshold-based speech detector (legacy-only use).
# - webrtc: WebRTC VAD Boolean speech detector. Modes 0--3; 1 is the
#   conservative high-recall default for quiet/whisper evaluation.
speech_detector:
  implementation: silero
  threshold: 0.5
  compare_implementation: webrtc
  aggressiveness: 1
  compare_aggressiveness_modes: [0, 1, 2]

# Compatibility-only legacy detector setting. The active classifier is selected
# below by whisper_classifier.implementation; leave this as feature.
whisper_detector:
  implementation: feature

# Active whisper classifier options:
# - legacy: existing RMS/ZCR/entropy classifier; retains whisper_probability.
# - grouped_v1: Stage 1 low-Silero candidate state plus grouped feature evidence.
# - temporal_v1: rolling Silero median plus low-band proportion variation.
#   Both require speech_detector.implementation: silero and speech_gate or shadow.
# compare_implementation may be omitted, legacy, grouped_v1, or temporal_v1. When present,
# it is logged alongside the primary; it never drives trigger/actuation.
# Classifier identity is deliberately independent of processing_mode.
whisper_classifier:
  implementation: temporal_v1
  compare_implementation: grouped_v1
  stage1_silero_probability_min: 0.005
  stage1_enter_consecutive_frames: 3
  stage1_exit_consecutive_frames: 10
  grouped_zcr_threshold: 0.080
  grouped_centroid_threshold_hz: 1280.0
  grouped_entropy_threshold: 2.60
  grouped_low_proportion_threshold: 0.80
  silero_window_frames: 10
  high_silero_threshold: 0.50
  high_silero_required_frames: 3
  # temporal_v1 only; analysis-only rolling statistics use this same window.
  rolling_window_frames: 10
  silero_median_min: 0.005  # Historical/default temporal_v1 setting; profiles override to 0.0025.
  silero_median_max: 0.50
  low_proportion_std_min: 0.05
  # temporal_v1 current-frame upper bound; set null to preserve historical behaviour.
  low_proportion_max: 0.85
  confirmation_frames: 20

# Legacy classifier smoothing settings; grouped_v1 keeps the existing external
# whisper_frames_required trigger counter instead of using these as its score.
decision_window: 10
trigger_ratio: 0.6

# Existing trigger/cooldown settings; unchanged by classifier selection.
whisper_frames_required: 10
cooldown_seconds: 7
run_duration_seconds: 600

# Legacy feature detector thresholds (retained unchanged).
rms_min: 0.005
rms_max: 0.1
zcr_min: 0.05
zcr_max: 0.3
entropy_min: 4.5

audio_buffer:
  # enabled: retain recent frames in the application ring buffer.
  # seconds: buffer duration in seconds.
  enabled: true
  seconds: 5
