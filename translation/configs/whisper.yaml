sample_rate: 16000frame_ms: 30device: "plughw:2,0"# ============================================================# Detector processing mode## direct:#     Whisper detector only## speech_gate:#     Speech detector controls whisper detector execution## shadow:#     Speech detector runs and logs,#     but does not affect whisper decisions# ============================================================processing_mode: direct# ============================================================# Detector implementations## Future examples:## speech_detector:#     implementation: silero## whisper_detector:#     implementation: cnn## ============================================================speech_detector:  implementation: customwhisper_detector:  implementation: featuredecision_window: 10trigger_ratio: 0.6whisper_frames_required: 10cooldown_seconds: 7run_duration_seconds: 600   # 10 minutes# ============================================================# Whisper feature detector thresholds# ============================================================rms_min: 0.005rms_max: 0.1zcr_min: 0.05zcr_max: 0.3entropy_min: 4.5# ============================================================# Audio buffering# ============================================================audio_buffer:  enabled: true  seconds: 5