sample_rate: 16000
frame_ms: 30
device: "plughw:2,0"

# direct runs only legacy; grouped_v1 requires Silero evidence.
processing_mode: shadow

speech_detector:
  implementation: silero
  threshold: 0.5

whisper_detector:
  implementation: grouped_v1
  compare implementation: legacy

# Classifier identity is deliberately independent of processing_mode.
whisper_classifier:
  implementation: grouped_v1
  compare_implementation: legacy
  stage1_silero_probability_min: 0.005
  stage1_enter_consecutive_frames: 3
  stage1_exit_consecutive_frames: 10
  grouped_zcr_threshold: 0.080
  grouped_centroid_threshold_hz: 1280.0
  grouped_entropy_threshold: 2.60
  grouped_low_proportion_threshold: 0.80
  silero_window_frames: 10
  high_silero_threshold: 0.50
  high_silero_required_frames: 3

decision_window: 10
trigger_ratio: 0.6
whisper_frames_required: 10
cooldown_seconds: 7
run_duration_seconds: 600

# Legacy feature detector thresholds (retained unchanged).
rms_min: 0.005
rms_max: 0.1
zcr_min: 0.05
zcr_max: 0.3
entropy_min: 4.5

audio_buffer:
  enabled: true
  seconds: 5
