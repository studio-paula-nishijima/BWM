project:

  src_path: "src"

files:

  events_file: "events.npy"

playback:

  # Deliberate default exhibition/test posture: boot active to demonstrate
  # playback/hardware without a person detector or remote subsystem. False is
  # an explicit deployment choice; application state never controls process lifecycle.
  initially_active: true

  enable_date_filter: true

  start_date: "2003-01-01"

  end_date: "2017-12-31"

  sleep_resolution: 0.001
  
  random_segment: true

  segment_minutes: 10

  # Session wall-clock lifetime.  A pause-and-fill reaction never extends it.
  session_timeout_seconds: 600

modulation:
  # Named effects are explicit requests, not an automatic reaction policy.
  strategies:
    cascade:
      type: cascade
      timeline_policy: overlay
      base_treatment: preserve
      ordered_targets: []
      inter_step_delay: 0.1
    multi_tap:
      type: multi_tap
      timeline_policy: overlay
      base_treatment: preserve
      repeat_count: 2
      inter_tap_delay: 0.1

  renormalize_segment: false

visualization:

  density_window_default: 10.0

safety:
  # Stage 1 preserves the released score without applying new restrictions.
  # Meaningful runtime safety belongs to a later dynamic-runtime stage.
  enabled: false
  max_duty_cycle: 1.0
  cooldown_window: 1.0
  max_continuous_on: 3600.0

# Runtime safety observes all events immediately before hardware routing.  Its
# emergency enforcement is disabled by default so this is not artistic shaping.
runtime_safety:
  enabled: false
  observe: true
  emergency:
    max_pulse_duration:
      enabled: true
      seconds: 5.0
      action: reject
    runaway_rate:
      enabled: true
      window_seconds: 5.0
      max_events: 40
    extreme_duty:
      enabled: false
      window_seconds: 10.0
      max_fraction: 0.95
  # Dimensionless retained-heat heuristic: useful for observation and only a
  # permissive last-resort cutoff. It is not a calibrated temperature model.
  thermal:
    enabled: true
    enforce: false
    reference_pulse_seconds: 0.15
    cooling_time_constant_seconds: 90.0
    emergency_load_threshold: 100.0

reaction_policy:
  default:
    mode: fixed
    strategy: cascade
# Semantic Voice interaction never activates a session.  A matching transition
# during an open session chooses one configured, non-pausing reaction.
voice_interaction:
  enabled: true
  trigger_state: capture_processing
  reaction_policy: voice_default
  # Fixed artistic selector bands.  This is neither confidence nor loudness.
  silero_selection_bands:
    - {upper_exclusive: 0.002, reaction_policy: voice_band_1}
    - {upper_exclusive: 0.006, reaction_policy: voice_band_2}
    - {upper_exclusive: 0.020, reaction_policy: voice_band_3}
    - {upper_exclusive: 0.060, reaction_policy: voice_band_4}
    - {upper_exclusive: .inf, reaction_policy: voice_band_5}

lighting:
  enabled: true
  serial_port: /dev/ttyUSB0
  start_address: 1
  frame_interval_seconds: 0.1
  retry_seconds: 5.0
  active_brightness_percent: 60
  active_cct_kelvin: 2700
  activation_fade_seconds: 4.0
  deactivation_fade_seconds: 4.0
  whisper_gesture:
    enabled: true
    pulse_count: 3
    duration_seconds: 7.0
    target_brightness_percent: 50
    target_cct_kelvin: 6500
  gesture_cooldown_seconds: 7.0
