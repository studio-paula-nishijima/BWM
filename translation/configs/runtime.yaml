project:

  src_path: "src"

files:

  events_file: "events.npy"

playback:

  # Application state: the process remains alive when this is false.
  initially_active: true

  enable_date_filter: true

  start_date: "2003-01-01"

  end_date: "2017-12-31"

  sleep_resolution: 0.001
  
  random_segment: true

  segment_minutes: 10

  # Session wall-clock lifetime.  A pause-and-fill reaction never extends it.
  session_timeout_seconds: 600

modulation:
  # Named effects are explicit requests, not an automatic reaction policy.
  strategies:
    cascade:
      timeline_policy: overlay
      base_treatment: preserve
      ordered_targets: []
      inter_step_delay: 0.1
    multi_tap:
      timeline_policy: overlay
      base_treatment: preserve
      repeat_count: 2
      inter_tap_delay: 0.1

  renormalize_segment: false

visualization:

  density_window_default: 10.0

safety:
  # Stage 1 preserves the released score without applying new restrictions.
  # Meaningful runtime safety belongs to a later dynamic-runtime stage.
  enabled: false
  max_duty_cycle: 1.0
  cooldown_window: 1.0
  max_continuous_on: 3600.0
