# Stage 3Q extension: CPU fallback defaults for Pi measurement, not laptop results.
asr:
  backend: faster_whisper
  model: base
  device: cpu
  compute_type: int8
  cpu_threads: 2
  worker_enabled: true
  worker_nice: 10
  queue_size: 1
  inference_timeout_seconds: 10
  result_log_path: logs/live_transcripts.csv

# Voice owns this local monotonic active-period timer.  The default deliberately
# matches Translation's configured installation/session duration without
# importing or depending on its runtime.
voice_session:
  active_period_seconds: 600
  initially_active: true
  stop_asr_when_quiescent: true
  interaction_button:
    enabled: true
    gpio: 17
    pull_up: true
    debounce_seconds: 0.4
