[platformio]
default_envs = devkitc_n16r8
src_dir = firmware/src
include_dir = firmware/include
test_dir = firmware/test

[env]
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Igenerated
    -DBWM_FULL_TRANSLATION
    -DCORE_DEBUG_LEVEL=1

[env:devkitc_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    ${env.build_flags}
    -DBWM_BOARD_ESP32S3_DEVKITC_N16R8

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    -std=c++17
